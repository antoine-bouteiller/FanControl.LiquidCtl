commit-msg:
  commands:
    lint-commit-msg:
      run: |
        head -n1 {1} | grep -Eq '^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+|Merge |Revert "|(fixup|squash|amend)! )' || {
          echo 'Commit message must follow Conventional Commits: type(scope)?!?: subject'
          exit 1
        }
pre-commit:
  parallel: true
  jobs:
    - name: Ruff Check
      glob: 'src/liquidctl_server/**/*.py'
      run: uv run --project src/liquidctl_server ruff check --fix {staged_files}
      stage_fixed: true
    - name: Ruff format
      glob: 'src/liquidctl_server/**/*.py'
      run: uv run --project src/liquidctl_server ruff format {staged_files}
      stage_fixed: true
    - name: Dotnet format
      glob: 'src/FanControl.Liquidctl/**/*.cs'
      run: dotnet format src/FanControl.Liquidctl/FanControl.Liquidctl.csproj --include {staged_files}
      stage_fixed: true
    - name: Dotnet format tests
      glob: 'src/FanControl.Liquidctl.Tests/**/*.cs'
      run: dotnet format src/FanControl.Liquidctl.Tests/FanControl.Liquidctl.Tests.csproj --include {staged_files}
      stage_fixed: true
