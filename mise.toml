[tools]
dotnet = "10"
python = "3.14"
uv = "0.13"
lefthook = "2.2.4"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks.lint]
run = "lefthook run pre-commit"

[tasks.format]
run = [
  "uv run --project src/liquidctl_server ruff format src/liquidctl_server",
  "dotnet format src/FanControl.Liquidctl/FanControl.Liquidctl.csproj",
]
