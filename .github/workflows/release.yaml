name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  checks:
    name: Quality Checks
    uses: ./.github/workflows/checks.yaml
    secrets: inherit
    permissions:
      checks: write
      pull-requests: write

  release:
    name: Release
    needs: [checks]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce develop is up to date with main
        if: github.ref == 'refs/heads/develop'
        run: |
          git merge-base --is-ancestor origin/main origin/develop
          if ($LASTEXITCODE -ne 0) {
            echo "ERROR: 'develop' is behind 'main'."
            echo "Please rebase 'main' into 'develop' before creating a pre-release."
            exit 1
          }

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: dotnet python uv

      - name: Cache Nuitka
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka
            ~\.cache\Nuitka
          key: nuitka-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Publish Release
        run: ./scripts/publish.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UV_CACHE_DIR: ${{ runner.temp }}\uv
